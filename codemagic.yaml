workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    working_directory: ucityapp
    environment:
      flutter: 3.41.1
      android_signing:
        - ucityapp_keystore  # Must match the keystore reference name in Codemagic: Teams > Code signing identities > Android
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - yminor13@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release
    max_build_duration: 120
    working_directory: ucityapp
    environment:
      flutter: 3.41.1
      xcode: latest
      ios_signing:
        # Requires the App Store Connect / Apple Developer Portal integration to be
        # enabled in Codemagic: Teams > Team settings > Integrations.
        distribution_type: app_store
        bundle_identifier: com.shymin.thegardenbyucity
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - yminor13@gmail.com
        notify:
          success: true
          failure: true
      # To upload builds to TestFlight automatically, uncomment the block below and
      # add at the workflow level (same indent as "environment:"):
      #   integrations:
      #     app_store_connect: <name of your App Store Connect API key in Codemagic>
      #
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
